<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workfront Assistant</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f4f4f0; height: 100vh; display: flex; flex-direction: column; }
  #header { background: #fff; border-bottom: 1px solid #e5e5e0; padding: 12px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  #header .logo { width: 28px; height: 28px; background: #ff3366; border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  #header h1 { font-size: 14px; font-weight: 600; color: #1a1a1a; }
  #header .subtitle { font-size: 12px; color: #888; margin-left: auto; }
  #messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .message { display: flex; gap: 10px; max-width: 100%; }
  .message.user { flex-direction: row-reverse; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
  .message.assistant .avatar { background: #ff3366; color: #fff; }
  .message.user .avatar { background: #1473e6; color: #fff; }
  .bubble { padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; max-width: calc(100% - 44px); word-wrap: break-word; }
  .message.assistant .bubble { background: #fff; border: 1px solid #e5e5e0; border-radius: 2px 12px 12px 12px; color: #1a1a1a; }
  .message.user .bubble { background: #1473e6; color: #fff; border-radius: 12px 2px 12px 12px; }
  .tool-call { background: #f0f7ff; border: 1px solid #b8d4f5; border-radius: 8px; padding: 8px 12px; font-size: 11px; color: #1473e6; display: flex; align-items: center; gap: 6px; }
  .tool-call::before { content: "⚙"; font-size: 12px; }
  .typing { display: flex; gap: 4px; padding: 10px 14px; background: #fff; border: 1px solid #e5e5e0; border-radius: 2px 12px 12px 12px; width: fit-content; }
  .typing span { width: 6px; height: 6px; background: #aaa; border-radius: 50%; animation: bounce 1.2s infinite; }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }
  #input-area { background: #fff; border-top: 1px solid #e5e5e0; padding: 12px 16px; display: flex; gap: 8px; align-items: flex-end; flex-shrink: 0; }
  #input { flex: 1; border: 1px solid #e5e5e0; border-radius: 8px; padding: 8px 12px; font-size: 13px; font-family: inherit; resize: none; outline: none; max-height: 100px; line-height: 1.4; color: #1a1a1a; }
  #input:focus { border-color: #1473e6; }
  #send { background: #1473e6; color: #fff; border: none; border-radius: 8px; width: 34px; height: 34px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s; }
  #send:hover { background: #0d66d0; }
  #send:disabled { background: #ccc; cursor: not-allowed; }
  .error { background: #fff5f5; border: 1px solid #ffb3b3; color: #cc0000; border-radius: 8px; padding: 8px 12px; font-size: 12px; }
  #welcome { text-align: center; padding: 32px 16px; color: #888; }
  #welcome h2 { font-size: 15px; color: #444; margin-bottom: 8px; }
  #welcome p { font-size: 12px; line-height: 1.6; }
  .suggestions { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 16px; }
  .suggestion { background: #fff; border: 1px solid #e5e5e0; border-radius: 16px; padding: 6px 12px; font-size: 12px; color: #444; cursor: pointer; transition: border-color 0.15s; }
  .suggestion:hover { border-color: #1473e6; color: #1473e6; }
</style>
</head>
<body>
<div id="header">
  <div class="logo">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
  </div>
  <h1>Workfront Assistant</h1>
  <span class="subtitle">AI-powered · adobedemoapac19101</span>
</div>
<div id="messages">
  <div id="welcome">
    <h2>What can I help you with?</h2>
    <p>Ask me anything about your projects, tasks, and teams.<br>I can update, assign, report, and more.</p>
    <div class="suggestions">
      <div class="suggestion" onclick="sendSuggestion(this)">Show my open projects</div>
      <div class="suggestion" onclick="sendSuggestion(this)">What tasks are overdue?</div>
      <div class="suggestion" onclick="sendSuggestion(this)">Summarise project status</div>
      <div class="suggestion" onclick="sendSuggestion(this)">Who is overallocated?</div>
    </div>
  </div>
</div>
<div id="input-area">
  <textarea id="input" placeholder="Ask about your projects..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="send" onclick="sendMessage()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/></svg>
  </button>
</div>
<script>
  var ANTHROPIC_API_KEY = "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";
  var WF_INSTANCE = "adobedemoapac19101origin.my.workfront.com";
  var WF_TOKEN = "eyJhbGciOiJSUzI1NiIsIng1dSI6Imltc19uYTEta2V5LWF0LTEuY2VyIiwia2lkIjoiaW1zX25hMS1rZXktYXQtMSIsIml0dCI6ImF0In0.eyJpZCI6IjE3ODEyMjUxMjMyMDRfOTIyZmI5ZjgtNjgyMS00YTQxLTkwZjMtOWY3ODdjYjhmNzJhX3V3MiIsIm9yZyI6IjA4RjM2MTkzNURGN0ExQTEwQTQ5NUZDRkBBZG9iZU9yZyIsInR5cGUiOiJhY2Nlc3NfdG9rZW4iLCJjbGllbnRfaWQiOiIwZjEyZDBmMzcxM2U0MmViOGYyMWE1NzBlN2Q4N2E5OSIsInVzZXJfaWQiOiI3OUFEODI0ODZBMkI0OEQzMEE0OTVDOURAdGVjaGFjY3QuYWRvYmUuY29tIiwiYXMiOiJpbXMtbmExIiwiYWFfaWQiOiI3OUFEODI0ODZBMkI0OEQzMEE0OTVDOURAdGVjaGFjY3QuYWRvYmUuY29tIiwiY3RwIjozLCJtb2kiOiJhNzAxZWFmNCIsImV4cGlyZXNfaW4iOiI4NjQwMDAwMCIsImNyZWF0ZWRfYXQiOiIxNzgxMjI1MTIzMjA0Iiwic2NvcGUiOiJvcGVuaWQsQWRvYmVJRCJ9.LO4b_1i66vF96Qmn4ySXR2LtMpH_NTwnxQbZRzLNMhldiRcXdxQObeOdGENvvuiOgJ7PgfNA3GBbp7JRCHzWPxbe__jHxPWxraA-npwIeoIvW1xk5X04rp0iC3gPf8YKUq-ZMX5kGse1JtqT9fA80-Ig83UgK8Tf8ZbvJe99WsuIzqc1igycfYLXstx4O5d_AllAhyKbx2GGGgYyurMFI3jiuYbs4ZZsRZPFaid0KVpIVNUMp826rWJ2NdmkmXNvy-8M8oMb1j34O4q-_neGnSVGkJyZJgtBY9WkhMHohxClRCG3K4s0muYx53GbWyBtDrj1kDAKHP30Gl2tT-Jn8g";

  var MCP_SERVER = {
    type: "url",
    url: "https://mcp.workfront.adobe.com/mcp/v1/workfront",
    name: "workfront",
    authorization_token: WF_TOKEN
  };

  var SYSTEM_PROMPT = "You are a helpful Workfront assistant embedded directly inside the Workfront interface for " + WF_INSTANCE + ". You have full access to the user's Workfront instance via the Workfront MCP tools. You can read and update projects, tasks, issues, users, portfolios, and more. Be concise and action-oriented. When you perform an action, confirm what you did clearly. When showing lists, keep them brief and scannable. Always use the Workfront tools to get real data - never make up project or task information.";

  var conversationHistory = [];
  var isLoading = false;

  function autoResize(el) {
    el.style.height = "auto";
    el.style.height = Math.min(el.scrollHeight, 100) + "px";
  }

  function handleKey(e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  }

  function sendSuggestion(el) {
    document.getElementById("input").value = el.textContent;
    sendMessage();
  }

  function removeWelcome() {
    var w = document.getElementById("welcome");
    if (w) w.remove();
  }

  function appendMessage(role, content) {
    removeWelcome();
    var msgs = document.getElementById("messages");
    var div = document.createElement("div");
    div.className = "message " + role;
    var initial = role === "user" ? "You" : "AI";
    div.innerHTML = '<div class="avatar">' + initial + '</div><div class="bubble">' + escapeHtml(content) + '</div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
    return div;
  }

  function appendToolCall(toolName) {
    removeWelcome();
    var msgs = document.getElementById("messages");
    var div = document.createElement("div");
    div.className = "message assistant";
    div.innerHTML = '<div class="avatar">AI</div><div class="tool-call">Using Workfront: ' + toolName + '</div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function showTyping() {
    removeWelcome();
    var msgs = document.getElementById("messages");
    var div = document.createElement("div");
    div.className = "message assistant";
    div.id = "typing-indicator";
    div.innerHTML = '<div class="avatar">AI</div><div class="typing"><span></span><span></span><span></span></div>';
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function hideTyping() {
    var t = document.getElementById("typing-indicator");
    if (t) t.remove();
  }

  function appendError(msg) {
    var msgs = document.getElementById("messages");
    var div = document.createElement("div");
    div.className = "error";
    div.textContent = "Error: " + msg;
    msgs.appendChild(div);
    msgs.scrollTop = msgs.scrollHeight;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/\n/g, "<br>");
  }

  function sendMessage() {
    if (isLoading) return;
    var input = document.getElementById("input");
    var text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    document.getElementById("send").disabled = true;
    isLoading = true;
    appendMessage("user", text);
    conversationHistory.push({ role: "user", content: text });
    showTyping();
    callClaude(conversationHistory).then(function(responseText) {
      hideTyping();
      appendMessage("assistant", responseText);
      conversationHistory.push({ role: "assistant", content: responseText });
      document.getElementById("send").disabled = false;
      isLoading = false;
    }).catch(function(err) {
      hideTyping();
      appendError(err.message);
      document.getElementById("send").disabled = false;
      isLoading = false;
    });
  }

  function callClaude(messages) {
    var body = {
      model: "claude-sonnet-4-6",
      max_tokens: 1024,
      system: SYSTEM_PROMPT,
      messages: messages,
      mcp_servers: [MCP_SERVER]
    };
    return fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "x-api-key": ANTHROPIC_API_KEY,
        "anthropic-version": "2023-06-01",
        "anthropic-beta": "mcp-client-2025-04-04",
        "anthropic-dangerous-direct-browser-access": "true"
      },
      body: JSON.stringify(body)
    }).then(function(res) {
      if (!res.ok) {
        return res.json().catch(function() { return {}; }).then(function(err) {
          throw new Error(err.error && err.error.message ? err.error.message : "API error " + res.status);
        });
      }
      return res.json();
    }).then(function(data) {
      var finalText = "";
      for (var i = 0; i < data.content.length; i++) {
        var block = data.content[i];
        if (block.type === "text") {
          finalText += block.text;
        } else if (block.type === "tool_use") {
          appendToolCall(block.name);
        }
      }
      if (data.stop_reason === "tool_use") {
        var toolResults = data.content
          .filter(function(b) { return b.type === "tool_use"; })
          .map(function(b) { return { type: "tool_result", tool_use_id: b.id, content: "Tool executed via MCP" }; });
        var updatedMessages = messages.concat([
          { role: "assistant", content: data.content },
          { role: "user", content: toolResults }
        ]);
        return callClaude(updatedMessages);
      }
      return finalText || "Done.";
    });
  }
</script>
</body>
</html>
